<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Artur Müller, Python e FastAPI em IA, PHP e Laravel no web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2530"/>
      <stop offset="100%" stop-color="#243447"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A6FA5"/>
      <stop offset="100%" stop-color="#7E97B8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="250" fill="url(#bg)"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.7s" fill="freeze"/>

    <text x="70" y="120" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="66" fill="#F4F4F2">Artur M&#252;ller</text>

    <rect x="72" y="140" width="208" height="5" rx="2.5" fill="url(#accent)"/>

    <text x="72" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#aebccd">Python e FastAPI em IA &#183; PHP e Laravel no web</text>
  </g>
</svg>
