name: Atualizar cards de estatísticas

on:
  # Uma vez por dia (06:00 UTC = 03:00 BRT). O horário do cron pode variar um pouco.
  schedule:
    - cron: "0 6 * * *"
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:
    inputs:
      quantidade:
        description: "Quantos commits de atualização gerar"
        default: "10"

permissions:
  contents: write

concurrency:
  group: stats-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar cards e gerar commits do dia
        env:
          # Personal Access Token SEU (enxerga dados privados). Secret PROFILE_TOKEN.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_USER: arturmuller25
          N: ${{ github.event.inputs.quantidade || '10' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret PROFILE_TOKEN ausente — abortando sem farmar."
            exit 0
          fi
          # Autor = e-mail verificado da conta, então os commits contam no gráfico.
          git config user.name "Artur"
          git config user.email "tutimuller2.0@gmail.com"

          MSGS=(
            "chore(stats): atualiza cards de estatísticas"
            "chore(stats): atualiza métricas do perfil"
            "chore(stats): recalcula linguagens e atividade"
            "chore(stats): sincroniza contribuições"
            "chore(stats): atualiza gráfico de linguagens"
            "chore(stats): atualiza contagem de commits"
            "chore(stats): regenera snapshot de estatísticas"
            "chore(stats): atualiza dados do perfil"
          )
          n=${#MSGS[@]}

          for i in $(seq 1 "$N"); do
            # marca única por commit -> diff real nos cards
            export STATS_TICK="$(date -u +%Y-%m-%dT%H:%M:%S.%N)-$i"
            python scripts/stats_card.py
            git add assets/stats-light.svg assets/stats-dark.svg assets/langs-light.svg assets/langs-dark.svg
            if git diff --cached --quiet; then
              echo "Iteração $i sem mudança, pulando."
              continue
            fi
            git commit -m "${MSGS[$(( (i - 1) % n ))]}"
          done

          git push
